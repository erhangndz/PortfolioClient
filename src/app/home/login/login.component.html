

 <div style="margin-top: 10%;"></div>
 <div class="container">
  <div class="row">
    <div class="col-6">
      <h2>Login Form</h2>
      <form (ngSubmit)="login()" #form="ngForm">
        <div class="form-group">
          <label>Email</label>
          <input type="text" #email="ngModel" name="email" class="form-control" ngModel="model.email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" #password="ngModel" name="password" class="form-control" ngModel="model.password">
        </div>
      <button class="btn btn-dark">Login</button>

      </form>
    </div>
  </div>

 </div>
