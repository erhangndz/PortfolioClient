


 <div class="container" style="margin-top: 100px;margin-bottom: 60px;">
  <div class="row">
    <div class="col-6">
      <h2>Admin Login</h2>
      <form (ngSubmit)="login()" #form="ngForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" #email name="email" class="form-control" [(ngModel)]="model.email" required="">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" #password name="password" class="form-control" [(ngModel)]="model.password" required="">
        </div>
      <button [disabled]="form.invalid" class="btn btn-dark" type="submit">Login</button>

      </form>
    </div>
  </div>
