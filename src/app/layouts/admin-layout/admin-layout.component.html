<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Sidebar</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
    }
    .sidebar {
      min-width: 250px;
      max-width: 250px;
      background-color: #343a40;
      color: white;
    }
    .sidebar .nav-link {
      color: white;
      transition: 0.3s;
    }
    .sidebar .nav-link:hover {
      background-color: #495057;
      color: #fff;
    }
    .content {
      flex-grow: 1;
      padding: 20px;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar d-flex flex-column p-3">
    <h4 class="text-center">Admin Paneli</h4>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item">
        <a href="admin/banner" class="nav-link">Banner</a>
      </li>
      <li>
        <a href="admin/education" class="nav-link">Education</a>
      </li>
      <li>
        <a href="#experience" class="nav-link">Experience</a>
      </li>
      <li>
        <a href="#skill" class="nav-link">Skill</a>
      </li>
      <li>
        <a href="#project" class="nav-link">Project</a>
      </li>
      <li>
        <a href="#category" class="nav-link">Category</a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="content">
   <router-outlet></router-outlet>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
