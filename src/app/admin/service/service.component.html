<div class="card text-left">
    <div class="card-body">
      <h3 class="card-title">Services</h3>

      <table class="table table-bordered table-hover">
        <tr>
          <th>#</th>
          <th>Service Title</th>
          <th>Delete</th>
          <th>Edit</th>
        </tr>

        <tr *ngFor="let item of services; let i = index">
          <th>{{ i + 1 }}</th>
          <td>{{ item.title }}</td>
          <td>
            <button class="btn btn-danger" (click)="deleteService(item.id)">
            <i class="fa fa-trash" aria-hidden="true"></i>  Delete
            </button>
          </td>
          <td>
            <button
              class="btn btn-info"
              (click)="onSelected(item)"
              data-bs-toggle="modal"
              data-bs-target="#editBannerModal"
            >
             <i class="fa fa-pencil" aria-hidden="true"></i> Edit
            </button>
          </td>
        </tr>
      </table>
      <button
        type="button"
        class="btn btn-dark"
        data-bs-toggle="modal"
        data-bs-target="#newBannerModal"
      >
      <i class="fa fa-plus-circle" aria-hidden="true"></i>  New Service
      </button>
    </div>
  </div>

  <!-- Create Modal -->
  <div
    class="modal fade"
    id="newBannerModal"
    tabindex="-1"
    aria-labelledby="newBannerModalLabel"
    aria-hidden="true"
  >
    <form #createForm="ngForm" (ngSubmit)="createService(); createForm.resetForm()">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="newBannerModalLabel">
              Create New Service
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label>Service Title</label>
              <input
                type="text"
                name="title"
                [(ngModel)]="service.title"
                class="form-control"
                required=""
              />
            </div>
            <div class="form-group">
              <label>Service Icon</label>
              <input
                type="text"
                name="icon"
                [(ngModel)]="service.icon"
                class="form-control"
                required=""
              />
            </div>
            <div class="form-group">
              <label>Service Description</label>
              <input
                type="text"
                name="description"
                [(ngModel)]="service.description"
                class="form-control"
                required=""
              />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              type="submit"
              class="btn btn-dark btn-block"
              data-bs-dismiss="modal"
              [disabled]="createForm.invalid || !createForm.dirty"
            >
             <i class="fas fa-save    "></i> Save Changes
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Update Modal -->
  <div
    class="modal fade"
    id="editBannerModal"
    tabindex="-1"
    aria-labelledby="editBannerModalLabel"
    aria-hidden="true"
  >
    <form #editForm="ngForm" (ngSubmit)="updateService()">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="editBannerModalLabel">
              Edit Service
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

            <div class="modal-body">
              <div class="form-group">
                <label>Service Title</label>
                <input
                  type="text"
                  name="title"
                  [(ngModel)]="editService.title"
                  class="form-control"
                  required=""
                />
              </div>
              <div class="form-group">
                <label>Service Icon</label>
                <input
                  type="text"
                  name="icon"
                  [(ngModel)]="editService.icon"
                  class="form-control"
                  required=""
                />
              </div>
              <div class="form-group">
                <label>Service Description</label>
                <input
                  type="text"
                  name="description"
                  [(ngModel)]="editService.description"
                  class="form-control"
                  required=""
                />
              </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              type="submit"
              class="btn btn-primary"
              data-bs-dismiss="modal"
              [disabled]="editForm.invalid || !editForm.dirty"
            >
            <i class="fa fa-pencil" aria-hidden="true"></i>  Update Changes
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>
