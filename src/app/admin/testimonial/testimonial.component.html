<div class="card text-left">
  <div class="card-body">
    <h3 class="card-title">Testimonials</h3>

    <table class="table table-bordered table-hover">
      <thead>
      <tr>
        <th>#</th>
        <th>Name Surname</th>
        <th>Title</th>
        <th>Comment</th>
        <th>Delete</th>
        <th>Edit</th>
      </tr>
    </thead>
<tbody>
      <tr *ngFor="let item of testimonials; let i = index">
        <th>{{ i + 1 }}</th>
        <td>{{ item.name }}</td>
        <td>{{ item.title }}</td>
        <td>{{ item.comment.slice(0, 20) + '...' | slice:0:20 }} <span *ngIf="item.comment.length > 20">...</span></td>
        <td>
          <button class="btn btn-outline-danger btn-sm" (click)="deleteTestimonial(item.id)">
          <i class="fa fa-trash" aria-hidden="true"></i>  Delete
          </button>
        </td>
        <td>
          <button
            class="btn btn-outline-info btn-sm"
            (click)="onSelected(item)"
            data-bs-toggle="modal"
            data-bs-target="#editBannerModal"
          >
           <i class="fa fa-pencil" aria-hidden="true"></i> Edit
          </button>
        </td>
      </tr>
    </tbody>
    </table>
    <button
      type="button"
      class="btn btn-dark btn-sm"
      data-bs-toggle="modal"
      data-bs-target="#newBannerModal"
    >
    <i class="fa fa-plus btn-sm" aria-hidden="true"></i>  New Testimonial
    </button>
  </div>
</div>

<!-- Create Modal -->
<div
  class="modal fade"
  id="newBannerModal"
  tabindex="-1"
  aria-labelledby="newBannerModalLabel"
  aria-hidden="true"
>
  <form #createForm="ngForm" (ngSubmit)="createTestimonial();createForm.resetForm()">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="newBannerModalLabel">
            Create New testimonial
          </h1>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Name Surname</label>
            <input
              type="text"
              #name
              name="name"
              [(ngModel)]="testimonial.name"
              class="form-control"
              required=""
            />
          </div>
          <div class="form-group">
            <label>Title</label>
            <input
              type="text"
              name="title"
              [(ngModel)]="testimonial.title"
              class="form-control"
              required=""
            />
          </div>
          <div class="form-group">
            <label>Comment</label>
            <textarea
              type="text"
              name="comment"
              [(ngModel)]="testimonial.comment"
              class="form-control"
              required=""
              rows="4"
            ></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            type="submit"
            class="btn btn-dark btn-block"
            data-bs-dismiss="modal"
            [disabled]="createForm.invalid"
          >
           <i class="fas fa-save    "></i> Save Changes
          </button>
        </div>
      </div>
    </div>
  </form>
</div>

<!-- Update Modal -->
<div
  class="modal fade"
  id="editBannerModal"
  tabindex="-1"
  aria-labelledby="editBannerModalLabel"
  aria-hidden="true"
>
  <form #editForm="ngForm" (ngSubmit)="updateTestimonial()">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="editBannerModalLabel">
            Edit testimonial
          </h1>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Name Surname</label>
            <input
              type="text"
              name="name"
              [(ngModel)]="editTestimonial.name"
              class="form-control"
              required=""
            />
          </div>
          <div class="form-group">
            <label>Title</label>
            <input
              type="text"
              name="title"
              [(ngModel)]="editTestimonial.title"
              class="form-control"
              required=""
            />
          </div>
          <div class="form-group">
            <label>Comment</label>
            <textarea
              type="text"
              name="comment"
              [(ngModel)]="editTestimonial.comment"
              class="form-control"
              required=""
              rows="4"
            ></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            type="submit"
            class="btn btn-primary"
            data-bs-dismiss="modal"
            [disabled]="editForm.invalid || !editForm.dirty"
          >
          <i class="fa fa-pencil" aria-hidden="true"></i>  Update Changes
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
