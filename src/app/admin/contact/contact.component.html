<div class="card text-left">
  <div class="card-body">
    <h3 class="card-title">Contact Information</h3>

    <table class="table table-bordered table-hover">
      <thead>
      <tr>
        <th>#</th>
        <th>Address</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Delete</th>
        <th>Edit</th>
      </tr>
    </thead>
<tbody>
      <tr *ngFor="let item of contacts; let i = index">
        <th>{{ i + 1 }}</th>
        <td>{{ item.address }}</td>
        <td>{{ item.email }}</td>
        <td>{{ item.phone }}</td>
        <td>
          <button class="btn btn-outline-danger btn-sm" (click)="deleteContact(item.id)">
           <i class="fa fa-trash" aria-hidden="true"></i> Delete
          </button>
        </td>
        <td>
          <button
            class="btn btn-outline-info btn-sm"
            (click)="onSelected(item)"
            data-bs-toggle="modal"
            data-bs-target="#editBannerModal"
          >
           <i class="fa fa-pencil" aria-hidden="true"></i> Edit
          </button>
        </td>
      </tr>
    </tbody>
    </table>
    <button
      type="button"
      class="btn btn-dark btn-sm"
      data-bs-toggle="modal"
      data-bs-target="#newBannerModal"
    >
     <i class="fa fa-plus" aria-hidden="true"></i>  New Contact
    </button>
  </div>
</div>

<!-- Create Modal -->
<div
  class="modal fade"
  id="newBannerModal"
  tabindex="-1"
  aria-labelledby="newBannerModalLabel"
  aria-hidden="true"
>
  <form #createForm="ngForm" (ngSubmit)="createContact(); createForm.resetForm()">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="newBannerModalLabel">
            Create New Contact
          </h1>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Address</label>
            <input
              type="text"
              #address
              name="name"
              [(ngModel)]="contact.address"
              class="form-control"
              required=""
            />
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input
              type="text"
              #phone
              name="phone"
              [(ngModel)]="contact.phone"
              class="form-control"
              required=""
            />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              #email
              name="email"
              [(ngModel)]="contact.email"
              class="form-control"
              required=""
            />
          </div>
          <div class="form-group">
            <label>Map Url</label>
            <input
              type="text"
              #mapUrl
              name="mapUrl"
              [(ngModel)]="contact.mapUrl"
              class="form-control"
              required=""
            />
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            type="submit"
            class="btn btn-dark btn-block"
            data-bs-dismiss="modal"
            [disabled]="createForm.invalid"
          >
            Save Changes
          </button>
        </div>
      </div>
    </div>
  </form>
</div>

<!-- Update Modal -->
<div
  class="modal fade"
  id="editBannerModal"
  tabindex="-1"
  aria-labelledby="editBannerModalLabel"
  aria-hidden="true"
>
  <form #editForm="ngForm" (ngSubmit)="updateContact()">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="editBannerModalLabel">
            Edit Contact
          </h1>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Address</label>
            <input
              type="text"
              #address
              name="name"
              [(ngModel)]="editContact.address"
              class="form-control"
              required=""
            />
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input
              type="text"
              #phone
              name="phone"
              [(ngModel)]="editContact.phone"
              class="form-control"
              required=""
            />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              #email
              name="email"
              [(ngModel)]="editContact.email"
              class="form-control"
              required=""
            />
          </div>
          <div class="form-group">
            <label>Map Url</label>
            <input
              type="text"
              #mapUrl
              name="mapUrl"
              [(ngModel)]="editContact.mapUrl"
              class="form-control"
              required=""
            />
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            type="submit"
            class="btn btn-primary"
            data-bs-dismiss="modal"
            [disabled]="editForm.invalid || !editForm.dirty"
          >
            Update Changes
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
